name: PR Guard

# 硬规则 1「无任务号不开 PR」的可执行实现。
# 依据：docs/code-review-process.md §4 步骤 0/2
#
# 为什么用 pull_request_target：守卫脚本必须来自受信任的基线分支，
# 否则 PR 作者可以修改脚本让自己通过（那样守卫就是摆设）。
# 本工作流不执行 PR 里的任何代码，只读取 PR 元数据。
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: PR guard (任务号 / 描述完整性)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch (trusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate PR metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # 引导期：守卫脚本随本 PR 一起引入时，基线分支上还不存在，先跳过而不是误红
          if [ ! -f scripts/pr-guard.mjs ]; then
            echo "::notice::scripts/pr-guard.mjs 尚未进入基线分支，本次跳过 PR 守卫（首次引入）"
            exit 0
          fi
          node scripts/pr-guard.mjs

      - name: Write summary
        if: always()
        run: |
          {
            echo "## PR Guard"
            echo ""
            echo "校验项：任务号存在性、PR 描述必需章节、变更定级、自查勾选数、证据区非空。"
            echo ""
            echo "未通过时按提示补齐 \`.github/pull_request_template.md\` 后重新提交（编辑 PR 描述会自动重跑）。"
          } >> "$GITHUB_STEP_SUMMARY"
