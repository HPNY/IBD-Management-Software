name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-smoke:
    name: API build & smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本以 package.json packageManager 字段为准（pnpm@9.15.0）

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 门禁范围（T0.4 裁决 2a）：生产依赖 high+ 必须为零。
      # dev 构建链已知无补丁/需工具链大版本升级的项记录于
      # docs/dependency-audit-notes.md，不阻塞本门禁，随工具链升级任务复查。
      - name: Dependency audit (high+, production deps)
        run: pnpm audit --prod --audit-level=high

      - name: Build API
        run: pnpm --filter @ibd/api build

      - name: Typecheck API
        run: pnpm --filter @ibd/api typecheck

      - name: Smoke env-guard
        run: pnpm --filter @ibd/api smoke:env

      - name: Smoke entities (pg-mem)
        run: pnpm --filter @ibd/api smoke:entities

      - name: Smoke migration (pg-mem)
        run: pnpm --filter @ibd/api smoke:migration

      - name: Smoke parse source (T2)
        run: pnpm --filter @ibd/api smoke:parse-source

      - name: Smoke storage
        run: pnpm --filter @ibd/api smoke:storage

      - name: Smoke push copy (privacy)
        run: pnpm --filter @ibd/api smoke:push-copy

  lint:
    name: Lint (eslint + format + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 增量门禁需要 diff 基线，浅克隆拿不到 base commit
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 全仓库 ESLint。存量违规已在 eslint-suppressions.json 基线化，
      # 因此这里必须为 0 error；新增违规会导致红。见 docs/code-review-standard.md §7。
      - name: ESLint
        run: pnpm lint

      # 只检查本次变更的文件（存量代码尚未格式化，全量检查必然失败）
      - name: Prettier (changed files only)
        run: pnpm format:check
        env:
          FORMAT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}

      # 只扫描本次变更新增的行，避免历史噪声
      - name: Secret scan (changed lines)
        run: pnpm secrets:scan
        env:
          SCAN_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}

      # 守卫脚本自身的回归。2026-11-13 发现 TASK_RE 只认 T/F/G 三种前缀且区分
      # 大小写，导致合法 PR（P11 / U7 / V13-05 …）被判「缺少任务号」直接红。
      # 没有测试时这种缺陷只能靠人工读脚本发现，故把冒烟挂进门禁。
      - name: PR guard self-test
        run: pnpm pr:guard:smoke

  typecheck:
    name: Typecheck (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 全 workspace 类型检查（此前只检查 @ibd/api，web / doctor-web / domain-types 未纳入）
      - name: Typecheck workspace
        run: pnpm typecheck

  parse-worker:
    name: Parse worker unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked Python deps
        working-directory: services/parse-worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: AI engine unit tests
        working-directory: services/parse-worker
        run: python -m app.tests.test_ai_engine

      - name: Lab data consistency guard
        working-directory: services/parse-worker
        run: python -m app.tests.test_lab_data_consistency

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos
        # deprecation info 不阻塞；warning 与 error 均阻塞 CI

      - name: Unit tests (full suite)
        working-directory: apps/mobile
        run: flutter test

  web-parse-smoke:
    name: Web parse mapping (C3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # C3 回归：worker snake_case → confirm camelCase 映射（纯函数，无需浏览器）
      - name: Smoke parse item mapping
        run: pnpm --filter @ibd/web test:parse-items
