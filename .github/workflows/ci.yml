name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-smoke:
    name: API build & smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本以 package.json packageManager 字段为准（pnpm@9.15.0）

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @ibd/api build

      - name: Typecheck API
        run: pnpm --filter @ibd/api typecheck

      - name: Smoke env-guard
        run: pnpm --filter @ibd/api smoke:env

      - name: Smoke entities (pg-mem)
        run: pnpm --filter @ibd/api smoke:entities

      - name: Smoke migration (pg-mem)
        run: pnpm --filter @ibd/api smoke:migration

      - name: Smoke storage
        run: pnpm --filter @ibd/api smoke:storage

  parse-worker:
    name: Parse worker unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked Python deps
        working-directory: services/parse-worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: AI engine unit tests
        working-directory: services/parse-worker
        run: python -m app.tests.test_ai_engine

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        # 业务 warning 已修复；deprecation info 不阻塞 CI
