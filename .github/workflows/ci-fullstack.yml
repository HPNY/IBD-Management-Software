name: CI-fullstack-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "scripts/ci-fullstack.sh"
      - ".github/workflows/ci-fullstack.yml"

jobs:
  e2e-fullstack:
    name: Fullstack E2E (Postgres+Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ibd
          POSTGRES_PASSWORD: ibd
          POSTGRES_DB: ibd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ibd -d ibd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @ibd/api build

      - name: Install parse-worker
        working-directory: services/parse-worker
        run: pip install -r requirements.lock

      - name: Run fullstack E2E (API + worker + tests in one script)
        env:
          DATABASE_URL: postgres://ibd:ibd@127.0.0.1:5432/ibd
          REDIS_URL: redis://127.0.0.1:6379
          STORAGE_DRIVER: local
          STORAGE_LOCAL_DIR: /tmp/ibd-uploads
          PUBLIC_BASE_URL: http://127.0.0.1:3000
          STORAGE_SECRET: ci-storage-secret
          RUN_MIGRATIONS: "true"
          NODE_ENV: development
        run: bash scripts/ci-fullstack.sh
