services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ibd
      POSTGRES_PASSWORD: ibd
      POSTGRES_DB: ibd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibd -d ibd"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgres://ibd:ibd@postgres:5432/ibd
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  parse-worker:
    build:
      context: .
      dockerfile: services/parse-worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
