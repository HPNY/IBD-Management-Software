[project]
name = "ibd-parse-worker"
version = "0.1.0"
description = "IBDers PDF 双引擎解析 Worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn>=0.52,<0.53",
  "pymupdf>=1.28,<1.29",
  "pydantic>=2.13,<3",
  "redis>=7.4,<8",
  "bullmq>=3.2,<4",
  "python-multipart>=0.0.32,<0.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.7.0"]

[tool.ruff]
line-length = 100
